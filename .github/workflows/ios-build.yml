name: Build Gomu Gomu Survivors iPhone IPA
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private release containing the sealed Unity export
        required: true
        type: string
      source_sha256:
        description: SHA256 of GomuGomuSurvivors-ios-export-v1.5.0.zip
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gomu-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this game's private export
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p input output
          gh release download "$SOURCE_TAG" --pattern GomuGomuSurvivors-ios-export-v1.5.0.zip --dir input
      - name: Verify archive and every exported file
        env:
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: python3 IOSBuild.py extract --archive input/GomuGomuSurvivors-ios-export-v1.5.0.zip --sha256 "$SOURCE_SHA256" --output output/extracted
      - name: Compile ARM64 iOS device app and package unsigned IPA
        run: python3 IOSBuild.py build --project output/extracted/ios-export --ipa output/GomuGomuSurvivors-iPhone-unsigned-v1.5.0.ipa --work output/work --report output/build-report.json
      - name: Attach the verified IPA to the private input release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh repo view "$GH_REPO" --json isPrivate --jq .isPrivate)" = true
          gh release upload "$SOURCE_TAG" \
            output/GomuGomuSurvivors-iPhone-unsigned-v1.5.0.ipa \
            output/GomuGomuSurvivors-iPhone-unsigned-v1.5.0.ipa.sha256 \
            output/build-report.json output/input-verification.json
      - name: Collect build diagnostics
        if: failure()
        run: |
          if test -f output/work/xcodebuild.log; then
            tail -n 160 output/work/xcodebuild.log
          fi
