name: Build Gomu Gomu Survivors iPhone IPA
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private release containing the sealed Unity export
        required: true
        type: string
      source_sha256:
        description: SHA256 of GomuGomuSurvivors-ios-export-v1.2.0.zip
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gomu-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this game's private export
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p input output
          gh release download "$SOURCE_TAG" --pattern GomuGomuSurvivors-ios-export-v1.2.0.zip --dir input
      - name: Verify archive and every exported file
        env:
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: python3 IOSBuild.py extract --archive input/GomuGomuSurvivors-ios-export-v1.2.0.zip --sha256 "$SOURCE_SHA256" --output output/extracted
      - name: Compile ARM64 iOS device app and package unsigned IPA
        run: python3 IOSBuild.py build --project output/extracted/ios-export --ipa output/GomuGomuSurvivors-iPhone-unsigned-v1.2.0.ipa --work output/work --report output/build-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: GomuGomuSurvivors-iPhone-unsigned-v1.2.0
          path: |
            output/GomuGomuSurvivors-iPhone-unsigned-v1.2.0.ipa
            output/GomuGomuSurvivors-iPhone-unsigned-v1.2.0.ipa.sha256
            output/build-report.json
            output/input-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Collect build diagnostics
        if: always()
        run: |
          if test -f output/work/xcodebuild.log; then
            tail -n 250 output/work/xcodebuild.log > output/xcodebuild-tail.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: GomuGomuSurvivors-iOS-diagnostics-v1.2.0
          path: |
            output/build-report.json
            output/input-verification.json
            output/work/xcodebuild.log
            output/xcodebuild-tail.txt
          if-no-files-found: warn
          retention-days: 7
